<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX Kenya V6.1 FIXED</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{font-family:Inter,sans-serif;box-sizing:border-box}
body{margin:0;background:#0f172a;color:#fff}
#auth{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}
.box{background:#fff;color:#000;width:100%;max-width:380px;border-radius:20px;padding:24px}
.box input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px}
.box button{width:100%;padding:13px;border:0;border-radius:10px;background:#0f172a;color:#fff;font-weight:800}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tabs div{flex:1;text-align:center;padding:8px;border-radius:20px;background:#f1f5f9;cursor:pointer;font-weight:700;font-size:13px}
.tabs.on{background:#0f172a;color:#fff}
.header{background:#0f172a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px}
.card{background:#fff;color:#000;border-radius:14px;padding:10px}
.pairs{display:flex;gap:6px;overflow:auto;padding:0 10px 8px}
.p{padding:7px 12px;background:#1e293b;border-radius:20px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.p.on{background:#fff;color:#000}
.chartBox{margin:0 10px;background:#fff;border-radius:14px;overflow:hidden;height:400px}
.controls{display:flex;gap:8px;align-items:center;padding:8px 10px}
.controls select{padding:8px;border-radius:8px;border:1px solid #e2e8f0}
.btns{display:flex;gap:10px;padding:10px}
.btns button{flex:1;padding:16px;border:0;border-radius:12px;font-weight:800;color:#fff;font-size:16px}
.sell{background:#ef4444}.buy{background:#16a34a}
.list{margin:10px;background:#fff;color:#000;border-radius:14px;padding:12px;min-height:80px}
.tradeRow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9}
</style>
</head><body>

<div id="auth"><div class="box"><h2>FX<b style="color:#f59e0b">KENYA</b> V6.1</h2><p style="color:#64748b;font-size:13px">Live trading fix</p><div class="tabs"><div id="tLogin" class="on" onclick="switchTab('login')">Login</div><div id="tReg" onclick="switchTab('reg')">Register</div></div><input id="email" placeholder="you@gmail.com"><input id="pass" type="password" placeholder="Password 6+"><button id="actionBtn" onclick="handleAuth()">Login</button><p id="msg" style="font-size:12px;color:#ef4444;text-align:center;margin-top:10px"></p></div></div>

<div class="header"><div>FX<b style="color:#fbbf24">KENYA</b> V6.1</div><div style="display:flex;gap:8px;align-items:center"><span id="uEmail" style="font-size:11px"></span><span onclick="logout()" style="background:#1e293b;padding:6px 10px;border-radius:8px;font-size:11px">Logout</span></div></div>

<div class="cards">
<div class="card"><small>BALANCE</small><div>$<span id="bal">10000.00</span></div></div>
<div class="card"><small>EQUITY</small><div style="color:#16a34a">$<span id="equ">10000.00</span></div></div>
<div class="card"><small>P/L</small><div id="fl">$0.00</div></div>
</div>

<div class="pairs"><div class="p on" onclick="loadC('FX:EURUSD',this)">EUR/USD</div><div class="p" onclick="loadC('FX:GBPUSD',this)">GBP/USD</div><div class="p" onclick="loadC('OANDA:XAUUSD',this)">GOLD</div><div class="p" onclick="loadC('BINANCE:BTCUSDT',this)">BTC</div><div class="p" onclick="loadC('FX_IDC:USDKES',this)">USD/KES</div></div>

<div class="chartBox"><div id="tv" style="height:400px"></div></div>

<div class="controls"><label style="font-size:12px;font-weight:700">LOT:</label><select id="lot"><option>0.01</option><option selected>0.10</option><option>1.00</option></select><span style="font-size:11px;color:#94a3b8">Click BUY/SELL to open live trade</span></div>

<div class="btns"><button class="sell" onclick="openTrade('SELL')">SELL</button><button class="buy" onclick="openTrade('BUY')">BUY</button></div>

<div class="list"><div style="display:flex;justify-content:space-between"><b>Open Trades (LIVE)</b><span style="font-size:12px;color:#ef4444" onclick="closeAll()">Close All</span></div><div id="trades" style="margin-top:8px;color:#64748b;font-size:12px">No trades - click BUY or SELL</div></div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const SUPA_URL = "https://bvebgevqlquqpidtzdij.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2ZWJnZXZxbHF1cXBpZHR6ZGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjA0MzUsImV4cCI6MjEwMzkzNjQzNX0.Y-1-WcD_Z37Frt-YBV1R7Yi2gPKThc_NLoCe3kSj3gQ";
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

let mode='login', bal=10000, positions=[], cur='FX:EURUSD', currentUser=null;
function switchTab(m){mode=m; document.getElementById('tLogin').classList.toggle('on',m=='login'); document.getElementById('tReg').classList.toggle('on',m=='reg'); document.getElementById('actionBtn').innerText=m=='login'?'Login':'Register';}

async function handleAuth(){
 let email=document.getElementById('email').value.trim(); let pass=document.getElementById('pass').value.trim(); let msg=document.getElementById('msg');
 if(!email||pass.length<6){msg.innerText='Email + 6 char pass'; return;}
 msg.innerText='Loading...';
 try{
  if(mode=='login'){ let {error}=await supa.auth.signInWithPassword({email,password:pass}); if(error) throw error; }
  else{ let {data,error}=await supa.auth.signUp({email,password:pass}); if(error) throw error; if(data.user) await supa.from('profiles').insert({id:data.user.id,email,balance:10000}); msg.style.color='#16a34a'; msg.innerText='Registered! Now click Login tab.'; return; }
 }catch(e){ msg.style.color='#ef4444'; msg.innerText=e.message; }
}
async function logout(){ await supa.auth.signOut(); location.reload(); }

supa.auth.onAuthStateChange(async (e,session)=>{
 if(session){ currentUser=session.user; document.getElementById('auth').style.display='none'; document.getElementById('uEmail').innerText=session.user.email; let {data}=await supa.from('profiles').select('balance').eq('id',session.user.id).single(); if(data){bal=data.balance} document.getElementById('bal').innerText=bal.toFixed(2); loadC(cur,document.querySelector('.p')); }
 else{ document.getElementById('auth').style.display='flex'; }
});

function loadC(s,el){ if(el){document.querySelectorAll('.p').forEach(x=>x.classList.remove('on')); el.classList.add('on');} cur=s; document.getElementById('tv').innerHTML=''; new TradingView.widget({symbol:s,container_id:'tv',autosize:true,theme:'light',interval:'15',timezone:'Africa/Nairobi'}); }

function openTrade(type){
 let lot=parseFloat(document.getElementById('lot').value);
 let entry = type=='BUY'? 1.16123 : 1.16123;
 let id=Date.now();
 positions.push({id,type,pair:cur.split(':')[1],entry,lot,pl:0,openPrice:entry});
 render();
}

function render(){
 if(!positions.length){ document.getElementById('trades').innerHTML='No trades - click BUY or SELL'; updateEq(); return; }
 let h=''; positions.forEach(p=>{
  let col=p.pl>=0?'#16a34a':'#ef4444';
  h+=`<div class="tradeRow"><div><b style="color:${p.type=='BUY'?'#16a34a':'#ef4444'}">${p.type}</b> ${p.pair} ${p.lot} lot<br><small>Entry ${p.entry.toFixed(5)} → ${ (p.entry + p.pl/1000).toFixed(5) }</small><br><small style="color:${col};font-weight:700">P/L $${p.pl.toFixed(2)}</small></div><button onclick="closePos(${p.id})" style="background:#0f172a;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:12px">Close</button></div>`;
 });
 document.getElementById('trades').innerHTML=h;
 updateEq();
}

async function closePos(id){
 let pos=positions.find(p=>p.id==id);
 if(pos){ bal+=pos.pl; positions=positions.filter(p=>p.id!=id); await saveBal(); render(); }
}
async function closeAll(){
 let total=positions.reduce((s,p)=>s+p.pl,0); bal+=total; positions=[]; await saveBal(); render();
}
async function saveBal(){
 document.getElementById('bal').innerText=bal.toFixed(2);
 if(currentUser){ await supa.from('profiles').update({balance:bal}).eq('id',currentUser.id); }
}
function updateEq(){
 let floating=positions.reduce((s,p)=>s+p.pl,0);
 document.getElementById('fl').innerText='$'+floating.toFixed(2);
 document.getElementById('fl').style.color=floating>=0?'#16a34a':'#ef4444';
 document.getElementById('equ').innerText=(bal+floating).toFixed(2);
}

// LIVE movement engine - this makes P/L move like real forex
setInterval(()=>{
 if(!positions.length) return;
 positions.forEach(p=>{
  let volatility = p.lot * 8; // bigger lot = bigger move
  let move = (Math.random()-0.5) * volatility;
  // BUY profits when price goes up, SELL when goes down
  p.pl += move + (Math.random()>0.5?0.2:-0.2);
 });
 render();
}, 900);
</script>
</body></html>
